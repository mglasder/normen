[project]
name = "normen"
version = "0.1.0"
description = "Vim-style CLI to search and read German law norms"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "rapidfuzz>=3.14.6",
    "textual>=2.0",
]

[project.scripts]
normen = "normen.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
