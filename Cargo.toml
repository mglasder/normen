[package]
name = "normen"
version = "0.1.0"
edition = "2021"
description = "Vim-style CLI to search and read German law from gesetze-im-internet.de"
authors = ["Magnus Glasder <magnus.glasder@gmail.com>"]
repository = "https://github.com/mglasder/normen"
homepage = "https://github.com/mglasder/normen"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["cli", "tui", "law", "germany", "gesetze"]
categories = ["command-line-utilities"]

[dependencies]
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
dirs = "5"
ini = { version = "0.21", package = "rust-ini" }
ratatui = "0.29"
regex = "1"
roxmltree = "0.20"
ureq = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = "2"

[dev-dependencies]
tempfile = "3"
